[workspace]
resolver = "2"
members = [
    "crates/neural-filter-core",
    "crates/research-cli",
]
exclude = [
    "firmware/esp32-benchmark",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["O. Yu. Zakhozhyi <PhD-G5-25-1>"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
